name: Regenerate OpenAPI SDK

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/api/spec/openapi.json'
      - 'packages/api/src/generated/**'
      - 'packages/api/openapi-ts.config.ts'

permissions:
  contents: read

concurrency:
  group: openapi-codegen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codegen:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SDK
        run: pnpm --filter @generaltranslation/api codegen

      - name: Commit generated SDK
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add packages/api/src/generated packages/api/spec/openapi.json
          if git diff --cached --quiet; then
            echo 'Generated SDK is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(api): regenerate OpenAPI SDK'
          git push origin "HEAD:${HEAD_REF}"

  # Fork PRs never get the write token above, so verify instead of committing.
  verify:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated SDK matches the spec
        run: |
          pnpm --filter @generaltranslation/api codegen
          if ! git diff --exit-code -- packages/api/src/generated packages/api/spec/openapi.json; then
            echo '::error::Generated SDK is out of date. Run `pnpm --filter @generaltranslation/api codegen` and commit the result.'
            exit 1
          fi
