name: Close Inactive Pull Requests

on:
  schedule:
    # Run weekly on Mondays at 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: List inactive pull requests without closing them
        type: boolean
        default: false

permissions:
  pull-requests: write

concurrency:
  group: close-inactive-prs
  cancel-in-progress: false

env:
  INACTIVE_DAYS: 14
  KEEP_OPEN_LABEL: keep-open

jobs:
  close-inactive-prs:
    name: Close pull requests inactive for two weeks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Close inactive pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
        run: |
          set -euo pipefail

          cutoff="$(date -u -d "${INACTIVE_DAYS} days ago" +%Y-%m-%d)"
          echo "Closing open pull requests with no activity since ${cutoff} that lack the '${KEEP_OPEN_LABEL}' label."

          numbers="$(gh pr list \
            --state open \
            --limit 1000 \
            --search "updated:<${cutoff} -label:${KEEP_OPEN_LABEL}" \
            --json number \
            --jq '.[].number')"

          if [ -z "${numbers}" ]; then
            echo "No inactive pull requests found."
            exit 0
          fi

          comment="Closed due to inactivity. This pull request had no activity for ${INACTIVE_DAYS} days. Reopen it if the work is still active, and add the \`${KEEP_OPEN_LABEL}\` label to exempt it from this weekly cleanup."

          failures=0
          for number in ${numbers}; do
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Would close #${number}"
              continue
            fi
            if gh pr close "${number}" --comment "${comment}"; then
              echo "Closed #${number}"
            else
              echo "::warning::Failed to close #${number}"
              failures=$((failures + 1))
            fi
          done

          if [ "${failures}" -gt 0 ]; then
            echo "::error::Failed to close ${failures} pull request(s)."
            exit 1
          fi
