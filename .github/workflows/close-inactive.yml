name: Close Inactive Pull Requests and Issues

on:
  schedule:
    # Run weekly on Mondays at 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  close-inactive:
    name: Close items inactive for two weeks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Close inactive pull requests and issues
        run: |
          query="updated:<$(date -u -d '14 days ago' +%F) -label:keep-open"
          comment='Closed due to inactivity. Reopen it if it is still relevant, and add the `keep-open` label to exempt it.'

          for n in $(gh pr list --search "$query" --limit 1000 --json number --jq '.[].number'); do
            gh pr close "$n" --comment "$comment"
          done

          for n in $(gh issue list --search "$query" --limit 1000 --json number --jq '.[].number'); do
            gh issue close "$n" --comment "$comment" --reason 'not planned'
          done
