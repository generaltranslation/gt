name: Preview Release

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.state == 'open' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-latest
    outputs:
      has-permissions: ${{ steps.permissions.outputs.require-result }}
    steps:
      - name: Check reviewer permissions
        id: permissions
        uses: actions-cool/check-user-permission@c21884f3dda18dafc2f8b402fe807ccc9ec1aa5e # v2
        with:
          username: ${{ github.event.review.user.login }}
          require: write

  publish:
    needs: check
    if: needs.check.outputs.has-permissions == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup development tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:release

      - name: Publish preview packages
        run: pnpm exec pkg-pr-new publish --pnpm --previewVersion --peerDeps --commentWithSha './packages/*'
