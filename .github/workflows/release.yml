name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

env:
  CI: true
jobs:
  release-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Create Release Pull Request
    runs-on: ubuntu-latest
    concurrency: ${{ github.workflow }}-release-pr-${{ github.ref }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: 'pnpm'

      - name: Install Dependencies
        # not frozen since we are using workspaces & package versions will change
        run: pnpm install --no-frozen-lockfile

      - name: Create Release Pull Request
        id: changesets-pr
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm run version-packages
          commit: '[ci] release'
          title: '[ci] release'
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clarify automatic publishing
        if: steps.changesets-pr.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets-pr.outputs.pullRequestNumber }}
        run: |
          body=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          manual_text='publish to npm yourself or [setup this action to publish automatically](https://github.com/changesets/action#with-publishing)'
          automatic_text='the packages will be published to npm automatically after this pull request is reviewed and merged'

          if [[ "$body" == *"$automatic_text"* ]]; then
            exit 0
          fi
          if [[ "$body" != *"$manual_text"* ]]; then
            echo '::error::The Changesets release instructions did not match the pinned action output.'
            exit 1
          fi

          updated_body=${body/"$manual_text"/"$automatic_text"}
          gh api --method PATCH \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --raw-field body="$updated_body" > /dev/null

  # GitHub Actions bot: 41898282. Allowed mergers: eoinest (73407149),
  # brian-lou (69982825), and archie-mckenzie (90429137).
  release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == 41898282 &&
      (github.event.pull_request.merged_by.id == 73407149 ||
        github.event.pull_request.merged_by.id == 69982825 ||
        github.event.pull_request.merged_by.id == 90429137)
    name: Publish Release
    runs-on: ubuntu-latest
    concurrency: ${{ github.workflow }}-publish-main
    permissions:
      actions: read # Required to authenticate retry recovery
      id-token: write # Required for npm trusted publishing
      contents: write
      pull-requests: read
    environment:
      name: 'release'
    steps:
      - name: Verify release pull request provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          owner=${GITHUB_REPOSITORY%%/*}
          repository=${GITHUB_REPOSITORY#*/}
          mapfile -t commit_shas < <(gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            --jq 'flatten | .[].sha')

          if [ "${#commit_shas[@]}" -eq 0 ]; then
            echo '::error::The release pull request has no commits.'
            exit 1
          fi

          for sha in "${commit_shas[@]}"; do
            commit=$(gh api graphql \
              -f owner="$owner" \
              -f name="$repository" \
              -f oid="$sha" \
              -f query='query($owner: String!, $name: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $name) {
                  object(oid: $oid) {
                    ... on Commit {
                      author { user { databaseId } }
                      signature {
                        isValid
                        signer { databaseId }
                        wasSignedByGitHub
                      }
                    }
                  }
                }
              }')

            if echo "$commit" | jq -e '
              .data.repository.object as $commit |
              ($commit.author.user.databaseId // 0) as $author |
              ($commit.signature // {}) as $signature |
              (
                $author == 41898282 and
                $signature.isValid == true and
                $signature.wasSignedByGitHub == true and
                $signature.signer.databaseId == 19864447
              ) or (
                ([73407149, 69982825, 90429137] | index($author)) != null and
                $signature.isValid == true and
                (
                  ($signature.wasSignedByGitHub == true and
                    $signature.signer.databaseId == 19864447) or
                  ($signature.wasSignedByGitHub == false and
                    $signature.signer.databaseId == $author)
                )
              )
            ' > /dev/null; then
              continue
            fi

            echo "::error::Untrusted release commit ${sha}. Commits must be created by github-actions[bot] or verifiably signed by Ernest, Brian, or Archie."
            exit 1
          done

      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify publish-only state
        run: |
          pending_changeset=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit)
          if [ -n "$pending_changeset" ]; then
            echo "::error file=$pending_changeset::Publishing requires a merged Changesets release PR with no pending changesets."
            exit 1
          fi

      - name: Authorize package publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if pnpm run check:release-versions; then
            exit 0
          fi

          if [ "$GITHUB_RUN_ATTEMPT" = '1' ]; then
            echo '::error::Release version validation failed before package publishing began.'
            exit 1
          fi

          attempt=1
          while [ "$attempt" -lt "$GITHUB_RUN_ATTEMPT" ]; do
            publish_conclusion=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${attempt}/jobs?per_page=100" \
              --jq '[.jobs[].steps[]? | select(.name == "Publish packages to npm") | .conclusion] | map(select(. != null and . != "skipped")) | first // ""')
            if [ -n "$publish_conclusion" ]; then
              echo "A previous attempt reached package publishing (${publish_conclusion}); continuing exact-run recovery."
              exit 0
            fi
            attempt=$((attempt + 1))
          done

          echo '::error::Release version validation failed, and no previous attempt reached package publishing.'
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip1

      - name: Install Dependencies
        # not frozen since we are using workspaces & package versions will change
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm run build:release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Publish packages to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger benchmark baseline update
        if: steps.changesets.outputs.published == 'true'
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          event-type: release-published
          client-payload: '{"publishedPackages": ${{ steps.changesets.outputs.publishedPackages }}}'

      - name: Find release PR
        id: find-release-pr
        if: steps.changesets.outputs.published == 'true'
        run: |
          pr_url='${{ github.event.pull_request.html_url }}'
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr list --state merged --base main --head changeset-release/main --limit 1 --json url --jq '.[0].url // ""')
          fi
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Slack release message
        id: format-slack
        if: steps.changesets.outputs.published == 'true'
        run: |
          published='${{ steps.changesets.outputs.publishedPackages }}'
          pr_url='${{ steps.find-release-pr.outputs.pr_url }}'

          # Build a bullet list of published packages
          packages=$(echo "$published" | jq -r '.[] | "• `\(.name)` → `\(.version)`"')

          # Compose the message
          if [ -n "$pr_url" ]; then
            message=$(printf '📦 *New packages published!*\n\n%s\n\n🔗 <%s|Release PR>\n\n<@U0AF0LK9ZDY>' "$packages" "$pr_url")
          else
            message=$(printf '📦 *New packages published!*\n\n%s\n\n<@U0AF0LK9ZDY>' "$packages")
          fi

          # Escape for JSON
          message_escaped=$(echo "$message" | jq -Rs .)
          echo "message=$message_escaped" >> $GITHUB_OUTPUT

      - name: Notify Slack of release
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.MOSS_PAGER_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "New packages published",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ steps.format-slack.outputs.message }}
                  }
                }
              ]
            }

      # gt (primary CLI package, lives in packages/cli/)
      - name: Check if gt binary release is needed
        id: check-gt
        run: |
          published_packages='${{ steps.changesets.outputs.publishedPackages }}'
          version=$(jq -r .version packages/cli/package.json)

          if [ -n "$published_packages" ] && echo "$published_packages" | jq -e 'any(.[]; .name == "gt")' > /dev/null; then
            echo "should_release_bin=true" >> $GITHUB_OUTPUT
          elif npm view "gt@${version}" version > /dev/null 2>&1 && ! npm view "gt@${version}-bin.0" version > /dev/null 2>&1; then
            latest_version=$(npm view 'gt@latest' version)
            if [ "$version" = "$latest_version" ]; then
              # This exact run published gt but failed before the binary
              # release landed; finish it without rolling latest backwards.
              echo "should_release_bin=true" >> $GITHUB_OUTPUT
            else
              echo "::warning::Skipping gt@${version} binary recovery because gt@latest is ${latest_version}."
              echo "should_release_bin=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_release_bin=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract gt version
        id: gt-version
        if: steps.check-gt.outputs.should_release_bin == 'true'
        run: |
          version=$(jq -er .version packages/cli/package.json)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build gt binaries
        if: steps.check-gt.outputs.should_release_bin == 'true'
        run: pnpm --filter gt run build:bin:clean

      - name: Upload gt binaries to R2
        if: steps.check-gt.outputs.should_release_bin == 'true'
        uses: ryand56/r2-upload-action@b801a390acbdeb034c5e684ff5e1361c06639e7c # v1.4
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET_NAME }}
          source-dir: packages/cli/binaries
          destination-dir: cli/v${{ steps.gt-version.outputs.version }}

      - name: Upload gt binaries to R2 (latest)
        if: steps.check-gt.outputs.should_release_bin == 'true'
        uses: ryand56/r2-upload-action@b801a390acbdeb034c5e684ff5e1361c06639e7c # v1.4
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET_NAME }}
          source-dir: packages/cli/binaries
          destination-dir: cli/latest

      # PyPI: gtx-cli (Python launcher with bundled gt binaries)
      - name: Setup Python
        if: steps.check-gt.outputs.should_release_bin == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Publish gtx-cli to PyPI
        if: steps.check-gt.outputs.should_release_bin == 'true'
        working-directory: packages/cli/pypi
        run: |
          python -m pip install --upgrade build twine
          python scripts/build_platform_wheels.py --version "${{ steps.gt-version.outputs.version }}" --source ../binaries --check --upload --skip-existing
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Release gt binary to npm
        if: steps.check-gt.outputs.should_release_bin == 'true'
        run: |
          pnpm --filter gt run bin:prep
          bin_version="${{ steps.gt-version.outputs.version }}-bin.0"
          # The registry intermittently rejects the short-lived trusted
          # publishing token partway through these large uploads; each retry
          # is a fresh npm invocation and a fresh OIDC token exchange.
          for attempt in 1 2 3 4 5; do
            if pnpm --filter gt publish --tag bin --no-git-checks; then
              break
            fi
            if npm view "gt@${bin_version}" version > /dev/null 2>&1; then
              echo "gt@${bin_version} reached the registry despite the error"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "Publishing gt@${bin_version} failed after ${attempt} attempts"
              exit 1
            fi
            echo "Publish attempt ${attempt} failed, retrying in 30s"
            sleep 30
          done
          pnpm --filter gt run bin:restore
          pnpm --filter gt run build:clean

      # gtx-cli (backward-compat wrapper, lives in packages/gtx-cli/)
      - name: Check if gtx-cli binary release is needed
        id: check-gtx-cli
        run: |
          published_packages='${{ steps.changesets.outputs.publishedPackages }}'
          version=$(jq -r .version packages/gtx-cli/package.json)

          if [ -n "$published_packages" ] && echo "$published_packages" | jq -e 'any(.[]; .name == "gtx-cli")' > /dev/null; then
            echo "should_release_bin=true" >> $GITHUB_OUTPUT
          elif npm view "gtx-cli@${version}" version > /dev/null 2>&1 && ! npm view "gtx-cli@${version}-bin.0" version > /dev/null 2>&1; then
            latest_version=$(npm view 'gtx-cli@latest' version)
            if [ "$version" = "$latest_version" ]; then
              # This exact run published gtx-cli but failed before the binary
              # release landed; finish it without rolling latest backwards.
              echo "should_release_bin=true" >> $GITHUB_OUTPUT
            else
              echo "::warning::Skipping gtx-cli@${version} binary recovery because gtx-cli@latest is ${latest_version}."
              echo "should_release_bin=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_release_bin=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract gtx-cli version
        id: gtx-cli-version
        if: steps.check-gtx-cli.outputs.should_release_bin == 'true'
        run: |
          version=$(jq -er .version packages/gtx-cli/package.json)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build gtx-cli binaries
        if: steps.check-gtx-cli.outputs.should_release_bin == 'true'
        run: pnpm --filter gtx-cli run build:bin:clean

      - name: Upload gtx-cli binaries to R2
        if: steps.check-gtx-cli.outputs.should_release_bin == 'true'
        uses: ryand56/r2-upload-action@b801a390acbdeb034c5e684ff5e1361c06639e7c # v1.4
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET_NAME }}
          source-dir: packages/gtx-cli/binaries
          destination-dir: gtx-cli/v${{ steps.gtx-cli-version.outputs.version }}

      - name: Upload gtx-cli binaries to R2 (latest)
        if: steps.check-gtx-cli.outputs.should_release_bin == 'true'
        uses: ryand56/r2-upload-action@b801a390acbdeb034c5e684ff5e1361c06639e7c # v1.4
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET_NAME }}
          source-dir: packages/gtx-cli/binaries
          destination-dir: gtx-cli/latest

      - name: Release gtx-cli binary to npm
        if: steps.check-gtx-cli.outputs.should_release_bin == 'true'
        run: |
          pnpm --filter gtx-cli run bin:prep
          bin_version="${{ steps.gtx-cli-version.outputs.version }}-bin.0"
          # The registry intermittently rejects the short-lived trusted
          # publishing token partway through these large uploads; each retry
          # is a fresh npm invocation and a fresh OIDC token exchange.
          for attempt in 1 2 3 4 5; do
            if pnpm --filter gtx-cli publish --tag bin --no-git-checks; then
              break
            fi
            if npm view "gtx-cli@${bin_version}" version > /dev/null 2>&1; then
              echo "gtx-cli@${bin_version} reached the registry despite the error"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "Publishing gtx-cli@${bin_version} failed after ${attempt} attempts"
              exit 1
            fi
            echo "Publish attempt ${attempt} failed, retrying in 30s"
            sleep 30
          done
          pnpm --filter gtx-cli run bin:restore
          pnpm --filter gtx-cli run build:clean

  odysseus-release:
    if: github.event_name == 'push' && github.ref_name == 'odysseus'
    name: Odysseus Release
    runs-on: ubuntu-latest
    concurrency: ${{ github.workflow }}-publish-odysseus
    permissions:
      id-token: write # Required for npm trusted publishing
      contents: write
      pull-requests: write
      packages: write
    environment:
      name: 'release'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Odysseus prerelease mode
        run: |
          test -f .changeset/pre.json
          test "$(jq -r '.mode' .changeset/pre.json)" = "pre"
          test "$(jq -r '.tag' .changeset/pre.json)" = "odysseus"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip1

      - name: Install Dependencies
        # not frozen since we are using workspaces & package versions will change
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm run build:release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Create Odysseus Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: bash scripts/version-packages-odysseus.sh
          publish: pnpm run release
          commit: '[ci] odysseus release'
          title: '[ci] odysseus release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
