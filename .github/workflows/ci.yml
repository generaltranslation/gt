name: CI - Run Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CI: true
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_RETRY: 10
permissions:
  contents: read

jobs:
  # Changesets owns this same-repository branch namespace. Release PRs only
  # contain generated version and changelog updates for changes that already
  # passed CI on main.
  release-merge-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require an admin to merge release PRs
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'changeset-release/') }}
        run: |
          echo '::error title=Admin merge required::Automated release PRs must be merged by a repository admin using the ruleset bypass.'
          exit 1

      - name: Allow standard PRs
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'changeset-release/') }}
        run: echo 'This is not an automated release PR.'

  lint:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup development tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Rebuild packages
        run: pnpm rebuild --filter='...[origin/${{ github.base_ref }}]'

      - name: Run lint
        run: pnpm lint

  tests:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup development tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Rebuild packages
        run: pnpm rebuild --filter='...[origin/${{ github.base_ref }}]'

      - name: Build packages
        run: pnpm exec turbo build --filter='...[origin/${{ github.base_ref }}]' --filter='!gt-next-middleware-e2e' --filter='!./examples/*'

      - name: Run tests
        run: pnpm exec turbo test --filter='...[origin/${{ github.base_ref }}]' --filter='!gt-next-middleware-e2e' --filter='!./examples/*'

  test-builds:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'changeset-release/') }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            node: 20
            next: '16.1.6'
          - os: windows-latest
            node: 24
            next: '16.1.6'
          - os: ubuntu-latest
            node: 20
            next: '16.1.6'
          - os: ubuntu-latest
            node: 24
            next: '16.1.6'
          - os: macos-latest
            node: 20
            next: '16.1.6'
          - os: macos-latest
            node: 24
            next: '16.1.6'
          - os: ubuntu-latest
            node: 20
            next: '15.5.9'
          - os: ubuntu-latest
            node: 24
            next: '15.5.9'
          - os: ubuntu-latest
            node: 20
            next: '16.0.10'
          - os: ubuntu-latest
            node: 24
            next: '16.0.10'
    runs-on: ${{ matrix.os }}
    env:
      npm_config_store_dir: ${{ github.workspace }}/.pnpm-store

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check if gt-next changed
        id: gt_next_changed
        shell: bash
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^packages/next/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Rust
        if: steps.gt_next_changed.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup development tools
        if: steps.gt_next_changed.outputs.changed == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true
          cache_key_prefix: mise-v1-node-${{ matrix.node }}
        env:
          MISE_NODE_VERSION: ${{ matrix.node }}

      - name: Get pnpm store directory
        if: steps.gt_next_changed.outputs.changed == 'true'
        id: pnpm-store
        # bash on all platforms: pwsh (windows default) expands $GITHUB_OUTPUT as empty
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: steps.gt_next_changed.outputs.changed == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.gt_next_changed.outputs.changed == 'true'
        run: pnpm install

      - name: Use Next.js ${{ matrix.next }}
        if: steps.gt_next_changed.outputs.changed == 'true'
        run: pnpm --filter base --filter general-cases add next@${{ matrix.next }} --save-exact

      - name: Test Builds
        if: steps.gt_next_changed.outputs.changed == 'true'
        run: |
          pnpm exec turbo build --filter=base... --force
          pnpm exec turbo build:turbopack --filter=base... --force

          pnpm exec turbo build --filter=general-cases... --force
          pnpm exec turbo build:turbopack --filter=general-cases... --force

  test-vue-versions:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'changeset-release/') }}
    strategy:
      matrix:
        vue: ['3.3.13', '3.5.40']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check if gt-vue or the Vue extractor changed
        id: gt_vue_changed
        shell: bash
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE "^packages/(vue|vue-extractor)/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup development tools
        if: steps.gt_vue_changed.outputs.changed == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true

      - name: Get pnpm store directory
        if: steps.gt_vue_changed.outputs.changed == 'true'
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: steps.gt_vue_changed.outputs.changed == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.gt_vue_changed.outputs.changed == 'true'
        run: pnpm install

      - name: Use Vue ${{ matrix.vue }}
        if: steps.gt_vue_changed.outputs.changed == 'true'
        run: |
          pnpm --filter gt-vue add --save-dev --save-exact --lockfile=false vue@${{ matrix.vue }}
          pnpm --filter @generaltranslation/vue-extractor add --save-dev --save-exact --lockfile=false vue@${{ matrix.vue }} @vue/compiler-dom@${{ matrix.vue }} @vue/compiler-sfc@${{ matrix.vue }}

      - name: Verify Vue ${{ matrix.vue }} toolchain
        if: steps.gt_vue_changed.outputs.changed == 'true'
        run: |
          pnpm --filter gt-vue exec node -e "const actual = require('vue/package.json').version; if (actual !== '${{ matrix.vue }}') throw new Error('vue resolved to ' + actual);"
          pnpm --filter @generaltranslation/vue-extractor exec node -e "for (const dependency of ['vue', '@vue/compiler-dom', '@vue/compiler-sfc']) { const actual = require(dependency + '/package.json').version; if (actual !== '${{ matrix.vue }}') throw new Error(dependency + ' resolved to ' + actual); }"

      - name: Build and test gt-vue and the Vue extractor
        if: steps.gt_vue_changed.outputs.changed == 'true'
        run: |
          pnpm exec turbo build --filter=gt-vue... --filter=@generaltranslation/vue-extractor...
          pnpm --filter gt-vue typecheck
          pnpm --filter gt-vue test
          pnpm --filter @generaltranslation/vue-extractor typecheck
          pnpm --filter @generaltranslation/vue-extractor test

  test-cli-binaries:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'changeset-release/') }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            binary: gt-linux-x64
          - os: ubuntu-latest
            arch: arm64
            binary: gt-linux-arm64
          - os: macos-latest
            arch: x64
            binary: gt-darwin-x64
          - os: macos-latest
            arch: arm64
            binary: gt-darwin-arm64
          - os: windows-latest
            arch: x64
            binary: gt-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check if CLI or an embedded extractor changed
        id: gt_cli_changed
        shell: bash
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE "^packages/(cli|python-extractor|vue-extractor)/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Rust
        if: steps.gt_cli_changed.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup development tools
        if: steps.gt_cli_changed.outputs.changed == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true

      - name: Get pnpm store directory
        if: steps.gt_cli_changed.outputs.changed == 'true'
        id: pnpm-store
        # bash on all platforms: pwsh (windows default) expands $GITHUB_OUTPUT as empty
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: steps.gt_cli_changed.outputs.changed == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.gt_cli_changed.outputs.changed == 'true'
        run: pnpm install

      - name: Build packages
        if: steps.gt_cli_changed.outputs.changed == 'true'
        run: pnpm exec turbo build --filter='gt...'

      - name: Build CLI binaries
        if: steps.gt_cli_changed.outputs.changed == 'true'
        shell: bash
        run: |
          cd packages/cli
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pnpm run build
            pnpm run build:bin:windows-x64
          else
            pnpm run build:bin:clean
          fi

      - name: Test CLI in test environment
        if: steps.gt_cli_changed.outputs.changed == 'true'
        shell: bash
        run: |
          cd tests/apps/cli-test-app
          pnpm gt --help

      - name: Exercise Vue extraction through the native CLI binary
        if: steps.gt_cli_changed.outputs.changed == 'true'
        shell: bash
        run: |
          if [[ "$(node -p 'process.arch')" != "${{ matrix.arch }}" ]]; then
            echo "Skipping execution of the cross-compiled ${{ matrix.arch }} binary on $(node -p 'process.arch')"
            exit 0
          fi
          cd tests/apps/cli-vue-binary-test
          ../../../packages/cli/binaries/${{ matrix.binary }} generate --config gt.config.json
          node --input-type=module -e "import fs from 'node:fs'; const catalog = JSON.parse(fs.readFileSync('dist/_gt/en.json', 'utf8')); for (const message of ['Hello from the native Vue extractor', 'Hello from module-level t in the native Vue extractor']) if (!Object.values(catalog).includes(message)) throw new Error('Native CLI did not extract: ' + message);"

  size:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      RUSTFLAGS: '-C link-arg=--allow-undefined'
      TURBO_ENV_MODE: loose
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check whether bundle inputs changed
        id: bundle_inputs
        shell: bash
        run: |
          if git diff --quiet origin/${{ github.base_ref }}...HEAD -- \
            .size-limit.cjs \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            tsdown.preset.mts \
            turbo.json \
            packages/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        if: steps.bundle_inputs.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup development tools
        if: steps.bundle_inputs.outputs.changed == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true

      - uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        if: steps.bundle_inputs.outputs.changed == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          script: pnpm exec size-limit --json
          # mise shims dispatch on argv[0]; the action's default (true) wraps
          # argv0 in literal quotes on every OS, producing an invalid shim name.
          windows_verbatim_arguments: false

  run-tests:
    if: ${{ always() && (github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'changeset-release/')) }}
    needs:
      [lint, tests, test-builds, test-vue-versions, test-cli-binaries, size]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo '::error title=Required CI did not pass::At least one required CI job failed, was cancelled, or was skipped.'
          exit 1

      - run: echo 'All tests passed'
