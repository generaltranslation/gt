name: CI - Run Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CI: true
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_NET_RETRY: 10
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install dependencies
        run: pnpm install

      - name: Rebuild packages
        run: pnpm rebuild --filter='...[origin/${{ github.base_ref }}]'

      - name: Run lint
        run: pnpm lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install dependencies
        run: pnpm install

      - name: Rebuild packages
        run: pnpm rebuild --filter='...[origin/${{ github.base_ref }}]'

      - name: Build packages
        run: pnpm exec turbo build --filter='...[origin/${{ github.base_ref }}]' --filter='!gt-next-middleware-e2e' --filter='!./examples/*'

      - name: Run tests
        run: pnpm exec turbo test --filter='...[origin/${{ github.base_ref }}]' --filter='!gt-next-middleware-e2e' --filter='!./examples/*'

  test-builds:
    strategy:
      matrix:
        include:
          - os: windows-latest
            node: 20
            next: '16.1.6'
          - os: windows-latest
            node: 24
            next: '16.1.6'
          - os: ubuntu-latest
            node: 20
            next: '16.1.6'
          - os: ubuntu-latest
            node: 24
            next: '16.1.6'
          - os: macos-latest
            node: 20
            next: '16.1.6'
          - os: macos-latest
            node: 24
            next: '16.1.6'
          - os: ubuntu-latest
            node: 20
            next: '15.5.9'
          - os: ubuntu-latest
            node: 24
            next: '15.5.9'
          - os: ubuntu-latest
            node: 20
            next: '16.0.10'
          - os: ubuntu-latest
            node: 24
            next: '16.0.10'
    runs-on: ${{ matrix.os }}
    env:
      npm_config_store_dir: ${{ github.workspace }}/.pnpm-store

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Check if gt-next changed
        id: gt_next_changed
        shell: bash
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^packages/next/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Node.js
        if: steps.gt_next_changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Setup Rust
        if: steps.gt_next_changed.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install dependencies
        if: steps.gt_next_changed.outputs.changed == 'true'
        run: pnpm install

      - name: Use Next.js ${{ matrix.next }}
        if: steps.gt_next_changed.outputs.changed == 'true'
        run: pnpm --filter base --filter general-cases add next@${{ matrix.next }} --save-exact

      - name: Test Builds
        if: steps.gt_next_changed.outputs.changed == 'true'
        run: |
          pnpm exec turbo build --filter=base... --force
          pnpm exec turbo build:turbopack --filter=base... --force

          pnpm exec turbo build --filter=general-cases... --force
          pnpm exec turbo build:turbopack --filter=general-cases... --force

  test-vue-versions:
    strategy:
      matrix:
        vue: ['3.3.13', '3.5.40']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if gt-vue or the Vue extractor changed
        id: gt_vue_changed
        shell: bash
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE "^packages/(vue|vue-extractor)/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gt_vue_changed.outputs.changed == 'true'
        name: Install pnpm

      - name: Setup Node.js
        if: steps.gt_vue_changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.gt_vue_changed.outputs.changed == 'true'
        run: pnpm install

      - name: Use Vue ${{ matrix.vue }}
        if: steps.gt_vue_changed.outputs.changed == 'true'
        run: |
          pnpm --filter gt-vue add --save-dev --save-exact --lockfile=false vue@${{ matrix.vue }}
          pnpm --filter @generaltranslation/vue-extractor add --save-dev --save-exact --lockfile=false vue@${{ matrix.vue }} @vue/compiler-dom@${{ matrix.vue }} @vue/compiler-sfc@${{ matrix.vue }}

      - name: Verify Vue ${{ matrix.vue }} toolchain
        if: steps.gt_vue_changed.outputs.changed == 'true'
        run: |
          pnpm --filter gt-vue exec node -e "const actual = require('vue/package.json').version; if (actual !== '${{ matrix.vue }}') throw new Error('vue resolved to ' + actual);"
          pnpm --filter @generaltranslation/vue-extractor exec node -e "for (const dependency of ['vue', '@vue/compiler-dom', '@vue/compiler-sfc']) { const actual = require(dependency + '/package.json').version; if (actual !== '${{ matrix.vue }}') throw new Error(dependency + ' resolved to ' + actual); }"

      - name: Build and test gt-vue and the Vue extractor
        if: steps.gt_vue_changed.outputs.changed == 'true'
        run: |
          pnpm exec turbo build --filter=gt-vue... --filter=@generaltranslation/vue-extractor...
          pnpm --filter gt-vue typecheck
          pnpm --filter gt-vue test
          pnpm --filter @generaltranslation/vue-extractor typecheck
          pnpm --filter @generaltranslation/vue-extractor test

  test-cli-binaries:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if CLI, Vue extractor, or Python extractor changed
        id: gt_cli_changed
        shell: bash
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE "^(packages/(cli|python-extractor|vue-extractor)|tests/apps/cli-binary-vue)/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gt_cli_changed.outputs.changed == 'true'
        name: Install pnpm

      - name: Setup Node.js
        if: steps.gt_cli_changed.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Bun
        if: steps.gt_cli_changed.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        if: steps.gt_cli_changed.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install dependencies
        if: steps.gt_cli_changed.outputs.changed == 'true'
        run: pnpm install

      - name: Build packages
        if: steps.gt_cli_changed.outputs.changed == 'true'
        run: pnpm exec turbo build --filter='gt...'

      - name: Build CLI binaries
        if: steps.gt_cli_changed.outputs.changed == 'true'
        shell: bash
        run: |
          cd packages/cli
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pnpm run build
            pnpm run build:bin:windows-x64
          else
            pnpm run build:bin:clean
          fi

      - name: Test CLI in test environment
        if: steps.gt_cli_changed.outputs.changed == 'true'
        shell: bash
        run: cd tests/apps/cli-test-app && pnpm install && pnpm gt --help

      - name: Test native CLI Vue extraction
        if: steps.gt_cli_changed.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64) host_binary=gt-linux-x64 ;;
            Linux:ARM64) host_binary=gt-linux-arm64 ;;
            macOS:X64) host_binary=gt-darwin-x64 ;;
            macOS:ARM64) host_binary=gt-darwin-arm64 ;;
            Windows:X64) host_binary=gt-win32-x64.exe ;;
            *) echo "Unsupported runner ${RUNNER_OS}:${RUNNER_ARCH}"; exit 1 ;;
          esac

          fixture=tests/apps/cli-binary-vue
          cleanup_fixture() {
            node -e \
              "require('node:fs').rmSync('tests/apps/cli-binary-vue/_gt', { recursive: true, force: true })"
          }
          trap cleanup_fixture EXIT

          for vue_version in 3.3.13 3.5.40; do
            pnpm --filter gt-cli-binary-vue-fixture add --save-exact --lockfile=false \
              "vue@${vue_version}" \
              "@vue/compiler-dom@${vue_version}" \
              "@vue/compiler-sfc@${vue_version}"
            pnpm --filter gt-cli-binary-vue-fixture exec node -e \
              "for (const dependency of ['vue', '@vue/compiler-dom', '@vue/compiler-sfc']) { const actual = require(dependency + '/package.json').version; if (actual !== '${vue_version}') throw new Error(dependency + ' resolved to ' + actual); }"

            output=$(
              cd "$fixture"
              NO_COLOR=1 ../../../packages/cli/binaries/"$host_binary" \
                --skip-version-check validate App.vue
            )
            echo "$output"
            grep -Fq "Success! Found 1 translatable entries for gt-vue." <<<"$output"

            (
              cd "$fixture"
              NO_COLOR=1 ../../../packages/cli/binaries/"$host_binary" \
                --skip-version-check generate --omit-config-ids
              node -e \
                "const fs = require('node:fs'); const expected = JSON.stringify(JSON.parse(fs.readFileSync('expected.json', 'utf8'))); for (const locale of ['en', 'fr']) { const actual = JSON.stringify(JSON.parse(fs.readFileSync('_gt/' + locale + '.json', 'utf8'))); if (actual !== expected) throw new Error(locale + ' catalog did not match expected.json'); }"
            )
            cleanup_fixture
          done

  size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      RUSTFLAGS: '-C link-arg=--allow-undefined'
      TURBO_ENV_MODE: loose
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          script: pnpm exec size-limit --json

  run-tests:
    needs:
      [lint, tests, test-builds, test-vue-versions, test-cli-binaries, size]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All tests passed"
