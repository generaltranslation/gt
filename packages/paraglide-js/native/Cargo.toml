[package]
name = "paraglide-context-native"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "The usage analysis of @generaltranslation/paraglide-js, as a Node addon."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"

[features]
default = ["node", "mimalloc"]
# A faster allocator than the system's for many threads.
mimalloc = ["dep:mimalloc"]
# The Node addon. Without it, the crate is the analysis alone: for `cargo test` and the examples.
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { version = "3", default-features = false, features = [
  "napi8",
], optional = true }
napi-derive = { version = "3", optional = true }
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_semantic = "=0.157.0"
oxc_span = "=0.157.0"
oxc_syntax = "=0.157.0"
oxc_resolver = "=11.24.2"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false, features = [
  "v2",
  "local_dynamic_tls",
], optional = true }
memchr = "2"
ryu-js = "1"
hashbrown = { version = "0.17", default-features = false }

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
