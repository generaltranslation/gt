[package]
name = "gt-swc-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Essential lints only
[lints.clippy]
# Catch common issues
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"

[lib]
crate-type = ["cdylib"]

[profile.release]
# Optimize for SWC plugin distribution
codegen-units = 1
lto = true
opt-level = "s" # Optimize for size
strip = "symbols" # Strip debug symbols

# Next.js only loads SWC plugins built against an swc_core version its plugin
# runner accepts, so the plugin is built once per runner generation and gt-next
# picks the wasm that matches the installed Next.js version:
# - swc-v79 (default): Next.js >= 16.4 (plugin runner 34)
# - swc-v49: Next.js 16.1 - 16.3
# Build exactly one: `--no-default-features --features swc-v49` for the latter.
[features]
default = ["swc-v79"]
swc-v49 = ["dep:swc_core_v49", "dep:swc_common_v18"]
swc-v79 = ["dep:swc_core_v79", "dep:swc_common_v26"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swc_core_v49 = { package = "swc_core", version = "49.0.0", features = [
  "ecma_plugin_transform",
], optional = true }
swc_core_v79 = { package = "swc_core", version = "79.0.0", features = [
  "ecma_plugin_transform",
], optional = true }
# Force the exact swc_common versions Next.js ships with each swc_core
swc_common_v18 = { package = "swc_common", version = "=18.0.0", optional = true }
swc_common_v26 = { package = "swc_common", version = "=26.0.0", optional = true }

# .cargo/config.toml defines few alias to build plugin.
# cargo build-wasip1 generates wasm32-wasip1 binary
# cargo build-wasm32 generates wasm32-unknown-unknown binary.

[dev-dependencies]
# Parse and print source code in end-to-end transform tests (for either swc_core)
swc_core_v49 = { package = "swc_core", version = "49.0.0", features = [
  "ecma_plugin_transform",
  "ecma_parser",
  "ecma_codegen",
] }
swc_core_v79 = { package = "swc_core", version = "79.0.0", features = [
  "ecma_plugin_transform",
  "ecma_parser",
  "ecma_codegen",
] }
