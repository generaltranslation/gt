[package]
name = "gt-swc-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Essential lints only
[lints.clippy]
# Catch common issues
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"

[lib]
crate-type = ["cdylib"]

[profile.release]
# Optimize for SWC plugin distribution
codegen-units = 1
lto = true
opt-level = "s" # Optimize for size
strip = "symbols" # Strip debug symbols

[features]
# Each feature builds the plugin against the swc_core ABI of a range of Next.js
# versions. Exactly one must be enabled. gt-next ships one wasm per feature and
# picks the wasm that matches the installed Next.js version.
default = ["swc-current"]
# Next.js >= 16.4 (swc_plugin_runner 34)
swc-current = ["dep:swc_core", "dep:swc_common"]
# Next.js 16.1 - 16.3 (swc_plugin_runner 23 - 30)
swc-legacy = ["dep:swc_core_legacy", "dep:swc_common_legacy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swc_core = { version = "79.0.0", features = [
  "ecma_plugin_transform",
], optional = true }
swc_core_legacy = { package = "swc_core", version = "49.0.0", features = [
  "ecma_plugin_transform",
], optional = true }

# Force exact swc_common versions to match Next.js
swc_common = { version = "=26.0.0", optional = true }
swc_common_legacy = { package = "swc_common", version = "=18.0.0", optional = true }

# .cargo/config.toml defines few alias to build plugin.
# cargo build-wasip1 generates wasm32-wasip1 binary
# cargo build-wasm32 generates wasm32-unknown-unknown binary.
