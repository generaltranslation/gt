pre-commit:
  parallel: false
  jobs:
    - run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      glob:
        - '*.{js,ts,jsx,tsx,mjs,cjs,mts,cts,json,jsonc,css,yml,yaml}'
        - '**/*.{js,ts,jsx,tsx,mjs,cjs,mts,cts,json,jsonc,css,yml,yaml}'
      stage_fixed: true
    - run: node scripts/generate-version.js
      root: packages/cli
